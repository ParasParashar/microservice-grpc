syntax = "proto3";

package order;

import "google/protobuf/timestamp.proto";

service OrderService {
  // 1. Client Streaming: Client streams order chunks -> Server returns single response
  rpc CreateOrderStream (stream CreateOrderChunkRequest) returns (CreateOrderResponse);

  // 2. Server Streaming: Single order ID request -> Server streams status events
  rpc GetOrderEventsStream (GetOrderEventsRequest) returns (stream OrderEventResponse);

  // 3. Bidirectional Streaming: Interactive order session (Commands <-> Events)
  rpc OrderProcessingSession (stream OrderSessionCommand) returns (stream OrderSessionEvent);
}

// -------------------------------------------------------------
// Client Streaming Messages (CreateOrderStream)
// -------------------------------------------------------------
message CreateOrderChunkRequest {
  string idempotencyKey = 1;
  
  oneof chunk {
    OrderMetadataChunk metadataChunk = 2;
    CustomerInfoChunk customerChunk = 3;
    OrderItemChunk itemChunk = 4;
    PaymentInfoChunk paymentChunk = 5;
  }
}

message OrderMetadataChunk {
  string currency = 1;
  string note = 2;
  map<string, string> tags = 3;
}

message CustomerInfoChunk {
  string customerId = 1;
  string shippingAddress = 2;
  string billingAddress = 3;
}

message OrderItemChunk {
  string productId = 1;
  string sku = 2;
  int32 quantity = 3;
  double unitPrice = 4;
}

message PaymentInfoChunk {
  string paymentMethod = 1;
  string transactionToken = 2;
  double amount = 3;
}

message CreateOrderResponse {
  string orderId = 1;
  string status = 2;
  double totalAmount = 3;
  int32 totalItems = 4;
  google.protobuf.Timestamp createdAt = 5;
  string idempotencyKey = 6;
}

// -------------------------------------------------------------
// Server Streaming Messages (GetOrderEventsStream)
// -------------------------------------------------------------
message GetOrderEventsRequest {
  string orderId = 1;
  bool include_historical = 2;
}

enum OrderEventType {
  ORDER_EVENT_UNSPECIFIED = 0;
  ORDER_EVENT_CREATED = 1;
  ORDER_EVENT_PAYMENT_PENDING = 2;
  ORDER_EVENT_PAYMENT_CONFIRMED = 3;
  ORDER_EVENT_PROCESSING = 4;
  ORDER_EVENT_PACKED = 5;
  ORDER_EVENT_SHIPPED = 6;
  ORDER_EVENT_DELIVERED = 7;
  ORDER_EVENT_CANCELLED = 8;
}

message OrderEventResponse {
  string eventId = 1;
  string orderId = 2;
  OrderEventType event_type = 3;
  string description = 4;
  google.protobuf.Timestamp timestamp = 5;
  map<string, string> metadata = 6;
}

// -------------------------------------------------------------
// Bidirectional Streaming Messages (OrderProcessingSession)
// -------------------------------------------------------------
enum SessionCommandType {
  CMD_UNSPECIFIED = 0;
  CMD_START_SESSION = 1;
  CMD_UPDATE_QUANTITY = 2;
  CMD_APPLY_COUPON = 3;
  CMD_CONFIRM_PAYMENT = 4;
  CMD_CANCEL_ORDER = 5;
}

message OrderSessionCommand {
  string sessionId = 1;
  SessionCommandType command_type = 2;
  string item_id = 3;
  int32 new_quantity = 4;
  string coupon_code = 5;
  google.protobuf.Timestamp timestamp = 6;
}

enum SessionEventType {
  EVENT_UNSPECIFIED = 0;
  EVENT_SESSION_STARTED = 1;
  EVENT_ORDER_UPDATED = 2;
  EVENT_PRICE_RECALCULATED = 3;
  EVENT_PAYMENT_STATUS_CHANGED = 4;
  EVENT_VALIDATION_FAILED = 5;
  EVENT_ORDER_CONFIRMED = 6;
  EVENT_ORDER_CANCELLED = 7;
}

message OrderSessionEvent {
  string sessionId = 1;
  SessionEventType event_type = 2;
  string message = 3;
  double current_total = 4;
  double discount_applied = 5;
  google.protobuf.Timestamp timestamp = 6;
}
