syntax = "proto3";

package common;

import "google/protobuf/timestamp.proto";

message RequestMetadata {
  string request_id = 1;
  string correlation_id = 2;
  string tenant_id = 3;
  string client_ip = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message UserContext {
  string user_id = 1;
  string email = 2;
  repeated string roles = 3;
}
